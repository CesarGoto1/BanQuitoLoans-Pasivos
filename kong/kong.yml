_format_version: "3.0"
_transform: true

services:
  - name: banquito-pasivos-monolito
    url: http://host.docker.internal:8081
    routes:
      - name: consultar-clientes
        paths:
          - /api/clientes
        methods:
          - GET
        strip_path: false

      - name: acreditar-desembolso
        paths:
          - /api/desembolsos
        methods:
          - POST
        strip_path: false

      - name: debitar-cuenta
        paths:
          - /api/pasivos/debitos
        methods:
          - POST
        strip_path: false

      - name: descargar-archivo-recaudacion
        paths:
          - /api/recaudaciones/archivo
        methods:
          - GET
        strip_path: false

    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
          key_in_header: true
          key_in_query: true
          hide_credentials: true

consumers:
  - username: core-activos
    keyauth_credentials:
      - key: bq-activos-c324637f4be7cdd68700dfbf
